<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>RAG Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
    


</head>

<body>

<div class="container">

    <header>

        <h1>🤖 RAG Assistant</h1>

        <p>
            Production Retrieval-Augmented Generation System
        </p>

    </header>

    <main>

        <!-- Question -->
         <section class="card">

    <h2>Ask a Question</h2>

    <textarea
        id="query"
        placeholder="Ask anything about your documents..."
    ></textarea>

    <button id="ask-btn">

        Ask

    </button>

</section>

        <!-- Answer -->
         <section class="card">

    <h2>Answer</h2>

    <div id="answer">

        Your answer will appear here...

    </div>

    <h3>Sources</h3>

    <ul id="sources">

    </ul>

</section>

    </main>

</div>
<footer>
    Powered by Hybrid Search • BM25 • Cross Encoder • ChromaDB • Groq
</footer>

<script src="/static/script.js"></script>
</body>
